name: C++ Formatting

on:
  pull_request:
    branches:
      - main
    paths:
      - "firmware/**/*.cpp"
      - "firmware/**/*.hpp"
      - "firmware/.clang-format"
      - ".github/workflows/clang-format.yml"

  push:
    branches:
      - main
    paths:
      - "firmware/**/*.cpp"
      - "firmware/**/*.hpp"
      - "firmware/.clang-format"
      - ".github/workflows/clang-format.yml"

  workflow_dispatch:

jobs:
  formatting:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install clang-format 21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y clang-format-21

      - name: Check C++ formatting
        run: |
          find firmware/src firmware/include firmware/test \
            \( -name "*.cpp" -o -name "*.hpp" \) \
            -print0 |
          xargs -0 clang-format-21 \
            --dry-run \
            --Werror \
            --style=file
